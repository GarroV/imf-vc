# Каждый день проверяет, что ссылки в карточках хаба живые (адреса продуктов, боты, демо).
# Упал — прогон красный, GitHub присылает письмо, список мёртвых ссылок — в сводке прогона.
# Задач здесь не заводит: репозиторий публичный, наши задачи живут в приватном GarroV/backlog
# (dotfiles/claude/decisions/2026-11-15-backlog-publichnyh-repo.md).
name: Links

on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths: ["src/content/projects/**", "tools/check-links.mjs"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверить ссылки
        id: check
        run: npm run check:links 2>&1 | tee links.log; exit "${PIPESTATUS[0]}"
      - name: Сводка прогона
        if: failure() && steps.check.outcome == 'failure'
        run: |
          { echo "### Мёртвые ссылки"; echo; echo '```'; grep -E '✗|Мёртвых' links.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
