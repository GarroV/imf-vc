login_steps:
  - ru: Попросите владельца проекта завести вам учётную запись веб-админки — самостоятельной регистрации нет.
    en: Ask the project owner to create a web admin account for you — there is no self-sign-up.
  - ru: Откройте ссылку и войдите. Если к учётке привязана рабочая почта Google — только кнопкой «Войти через Google» (вход паролем для таких учёток закрыт), иначе — логином и паролем. Рейтинги — пункт «Рейтинги» в меню.
    en: Open the link and sign in. If a Google work email is linked to your account, use “Sign in with Google” (password sign-in is closed for such accounts); otherwise use your username and password. Ratings are under “Ratings” in the menu.
  - ru: Всё подключение — в «Настройках» (аватар учётки внизу слева, на телефоне — вверху). Чтобы проводить проверки, там же нажмите «Привязать бота» и откройте ссылку в Telegram — бот @dodo_as_bot привяжется к вашей учётке. Доступ к боту есть у полевых ролей.
    en: Everything you connect lives in “Settings” (your avatar at the bottom left, at the top on a phone). To run audits, press “Link the bot” there and open the link in Telegram — the @dodo_as_bot bot is linked to your account. The bot is open to field roles.
  - ru: У поля ввода в боте есть кнопка «Приложение» — мини-апп аудитора. Идёт проверка — открывается обход с зонами, чек-листом и записью нарушений, иначе главная; там же настройки приложения. Начать проверку — /start в чате; вести её можно и в приложении, и в чате.
    en: Next to the message field the bot has an “App” button — the auditor mini app. During an audit it opens the walk-through with zones, the checklist and recording of findings, otherwise the home screen; the app settings are there too. Start an audit with /start in the chat; you can run it in the app or in the chat.
  - ru: Подключить Claude (claude.ai, Desktop, телефон, Claude Code) — «Настройки» → «Claude». Доступ никто не выдаёт — вы подключаете его сами, а что доступно в Claude, решает ваша роль. Отключение учётки или смена роли гасит доступ сразу.
    en: To connect Claude (claude.ai, Desktop, mobile, Claude Code) open “Settings” → “Claude”. Nobody grants access — you connect it yourself, and your role decides what Claude can do. Disabling the account or changing its role cuts access at once.
