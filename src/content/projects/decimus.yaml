login_steps:
  - ru: Попросите владельца проекта завести вам учётную запись веб-админки — самостоятельной регистрации нет.
    en: Ask the project owner to create a web admin account for you — there is no self-sign-up.
  - ru: Откройте ссылку и войдите через Google рабочей почтой или по логину и паролю. Рейтинги — пункт «Рейтинги» в меню.
    en: Open the link and sign in with Google using your work email, or with your username and password. Ratings are under “Ratings” in the menu.
  - ru: Чтобы проводить проверки, попросите добавить ваш Telegram в список приглашённых бота, затем откройте бота @dodo_as_bot по второй ссылке и отправьте /start.
    en: To run audits, ask for your Telegram account to be added to the bot’s invite list, then open the @dodo_as_bot bot from the second link and send /start.
  - ru: У поля ввода в боте есть кнопка «Приложение» — мини-апп аудитора. Идёт проверка — открывается обход с зонами, чек-листом и записью нарушений, иначе главная; там же настройки (язык, подключение Claude). Начать проверку — /start в чате; вести её можно и в приложении, и в чате.
    en: Next to the message field the bot has an “App” button — the auditor mini app. During an audit it opens the walk-through with zones, the checklist and recording of findings, otherwise the home screen; settings (language, connecting Claude) are there too. Start an audit with /start in the chat; you can run it in the app or in the chat.
