summary:
  ru: Выездные проверки пиццерий и рейтинги IMF. Аудитор ведёт проверку в боте или в мини-аппе обхода прямо в Telegram, движок считает оценку и собирает PDF-отчёт и письмо партнёру. В веб-админке — раздел «Рейтинги» с РС и РКО по странам IMF вместо Google-таблиц.
  en: On-site pizzeria audits and IMF ratings. The auditor runs the audit in a bot or in the walk-through mini app inside Telegram; the engine scores it and builds a PDF report and a letter to the partner. The web admin has a Ratings section — standards and customer-experience ratings by IMF country, replacing the Google Sheets.
