summary:
  ru: Цифровые чек-листы станций. Стандарт заводится в вебе, а на кухне чек-лист открыт в браузере планшета, привязанного к станции.
  en: Digital station checklists. The standard is set up on the web; in the kitchen the checklist runs in the browser of a tablet paired to the station.
audience:
  ru: Методисты и управляющие — в кабинете; сотрудники кухни — по QR
  en: Methodologists and managers in the admin; kitchen staff via QR
runs_on:
  ru: Браузер планшета, привязанного к станции; по QR — с любого телефона
  en: The browser of a tablet paired to the station; any phone via QR
